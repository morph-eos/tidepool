name: Question or idea
description: A question about the design, or a change you would like to see
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste secrets, domains, IP addresses, serial numbers or account names.** Use placeholders.
  - type: textarea
    id: what
    attributes:
      label: What is it
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why (the problem it solves; the decision record it touches, if you know it)
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidentiality
      options:
        - label: I removed every secret, domain, IP address, serial number and account name from this text
          required: true
