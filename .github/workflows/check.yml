# `nix flake check` on every pull request and on main: both hosts must build and the version-watch rules must pass their unit test (ADR 0016, 0017, 0018).
# The repository is public, so hosted runners cost nothing. Actions are pinned by commit (a tag can be moved); Renovate keeps the pins current.
name: check
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:   # a run by hand, from the Actions tab
permissions:
  contents: read
jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: nix flake check
        working-directory: nixos
        run: nix flake check --print-build-logs
