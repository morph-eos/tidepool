# Version watch (ADR 0017). Inputs: tidepool_deployed_* (written by modules/versions.nix from the packages and image tags that are really in the system generation)
# and tidepool_upstream_* (json_exporter reading endoflife.date and GitHub). Everything is "behind for 3 whole days, looked at on the weekend":
# a recording rule says 1 or 0 every 5 minutes, an alert needs a window of 3 days that is all 1 and almost full of samples (about 780 of 864), so a restart or a new
# upstream release inside the window does not raise it early. The upstream series are scraped hourly, so last_over_time bridges the 5-minute staleness of Prometheus.
groups:
- name: versions-record
  interval: 5m
  rules:
  # an app runs an older release of its OWN line than the newest one upstream publishes for that line (a patch, i.e. mostly a security fix); apps whose lines come from endoflife.date
  - record: tidepool:behind_patch
    expr: |
      max by (app) (
        (last_over_time(tidepool_upstream_cycle_latest{eol="false"}[3h]) and on (app, cycle) tidepool_deployed_info)
        unless on (app, cycle, version) tidepool_deployed_info
      ) or on (app) (0 * max by (app) (tidepool_deployed_info{source="eol"}))
  # apps that only have a "latest release" upstream (GitHub): any release newer than the running one (a patch or a major, upstream does not say)
  - record: tidepool:behind_release
    expr: |
      max by (app) (
        label_replace(last_over_time(tidepool_upstream_latest_latest[3h]), "version", "$1", "version", "(?:v|release/)?(.*)")
        unless on (app, version) tidepool_deployed_info
      ) or on (app) (0 * max by (app) (tidepool_deployed_info{source="github"}))
  # a newer release line exists upstream than the one running (a major, or a minor for nginx): a reminder, the decision to move is the owner's
  - record: tidepool:behind_major
    expr: max by (app) (last_over_time(tidepool_upstream_cycle_number{eol="false"}[3h])) > bool on (app) max by (app) (tidepool_deployed_cycle)
  # the running line no longer gets fixes at all
  - record: tidepool:line_eol
    expr: max by (app) (last_over_time(tidepool_upstream_cycle_latest{eol="true"}[3h]) and on (app, cycle) tidepool_deployed_info)
- name: versions-alert
  rules:
  # Saturday and Sunday from 07:00 UTC; the route sends ONE mail for them (repeat_interval 47h) and no "resolved" mail
  - alert: UpstreamPatchNotDeployed
    expr: min_over_time(tidepool:behind_patch[3d]) == 1 and on (app) (count_over_time(tidepool:behind_patch[3d]) > 780) and on () ((day_of_week() == 6 or day_of_week() == 0) and hour() >= 7)
    labels: { severity: weekly }
    annotations: { summary: "{{ $labels.app }}: upstream has had a newer release of the running line for 3 days" }
  - alert: UpstreamReleaseNotDeployed
    expr: min_over_time(tidepool:behind_release[3d]) == 1 and on (app) (count_over_time(tidepool:behind_release[3d]) > 780) and on () ((day_of_week() == 6 or day_of_week() == 0) and hour() >= 7)
    labels: { severity: weekly }
    annotations: { summary: "{{ $labels.app }}: upstream has had a newer release for 3 days" }
  - alert: UpstreamMajorNotAdopted
    expr: min_over_time(tidepool:behind_major[3d]) == 1 and on (app) (count_over_time(tidepool:behind_major[3d]) > 780) and on () ((day_of_week() == 6 or day_of_week() == 0) and hour() >= 7)
    labels: { severity: weekly }
    annotations: { summary: "{{ $labels.app }}: a newer major exists upstream for 3 days" }
  - alert: RunningLineEndOfLife
    expr: last_over_time(tidepool:line_eol[15m]) == 1 and on () ((day_of_week() == 6 or day_of_week() == 0) and hour() >= 7)
    labels: { severity: weekly }
    annotations: { summary: "{{ $labels.app }}: the running release line is end of life upstream" }
  # the watch itself: if the sources cannot be read for a day, silence would look like "all current"
  - alert: VersionWatchBlind
    expr: up{job=~"upstream-.*"} == 0
    for: 1d
    labels: { severity: warning }
    annotations: { summary: "the version watch cannot read {{ $labels.instance }}" }
