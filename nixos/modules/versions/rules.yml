# Version watch (ADR 0017). Inputs: tidepool_deployed_* (written by modules/versions.nix from the packages and image tags that are really in the system generation),
# tidepool_upstream_* (json_exporter reading endoflife.date and GitHub: the newest STABLE release, pre-releases excluded) and tidepool_nixpkgs_latest_* (Repology: the version on the
# stable nixpkgs branch). The aim is the newest stable release, and a mail that is worth reading: two tiers.
#   WEEKLY  (Saturday/Sunday): something you can act on - upstream has a newer release, it has been so for 3 days, and nixpkgs ALREADY has it (bump flake.lock) or the app
#           does not come from nixpkgs (a container pin, or nixpkgs is not asked) .
#   MONTHLY (the first weekend of the month): what only waiting or a decision resolves - nixpkgs has been behind upstream for 14 days, a newer major exists, the running line is end of life.
# Every judgement needs its whole window of samples, so a restart or a release of the last hours never raises it early. The scrapes are hourly: last_over_time bridges the
# 5-minute staleness of Prometheus.
groups:
- name: versions-record
  interval: 5m
  rules:
  # the newest stable release of the line that runs: GitHub's latest release for apps with one line, endoflife.date's newest release of the running line for the others
  - record: tidepool:upstream_mine
    expr: |
      max by (app, version) (label_replace(last_over_time(tidepool_upstream_latest_latest[3h]), "version", "$1", "version", "(?:v|release/)?(.*)"))
      or
      max by (app, version) (last_over_time(tidepool_upstream_cycle_latest{eol="false"}[3h]) and on (app, cycle) tidepool_deployed_info)
  # 1: upstream has something newer than what runs AND nixpkgs has that same version (or nixpkgs is not asked about this app): a lock bump or a new pin fixes it
  - record: tidepool:behind_actionable
    expr: |
      max by (app) (
        ((tidepool:upstream_mine unless on (app, version) tidepool_deployed_info) and on (app, version) last_over_time(tidepool_nixpkgs_latest_latest[3h]))
        or
        ((tidepool:upstream_mine unless on (app, version) tidepool_deployed_info) unless on (app) last_over_time(tidepool_nixpkgs_latest_latest[3h]))
      ) or on (app) (0 * max by (app) (tidepool_deployed_info))
  # 1: upstream has something newer than what runs and nixpkgs does NOT have it yet: nothing to bump, only to wait (or to override)
  - record: tidepool:behind_waiting
    expr: |
      max by (app) (
        ((tidepool:upstream_mine unless on (app, version) tidepool_deployed_info) and on (app) last_over_time(tidepool_nixpkgs_latest_latest[3h]))
        unless on (app, version) last_over_time(tidepool_nixpkgs_latest_latest[3h])
      ) or on (app) (0 * max by (app) (tidepool_deployed_info))
  # a newer release LINE exists upstream than the one running (a major): a reminder, the decision to move is the owner's
  - record: tidepool:behind_major
    expr: max by (app) (last_over_time(tidepool_upstream_cycle_number{eol="false"}[3h])) > bool on (app) max by (app) (tidepool_deployed_cycle)
  # the running line no longer gets fixes at all
  - record: tidepool:line_eol
    expr: max by (app) (last_over_time(tidepool_upstream_cycle_latest{eol="true"}[3h]) and on (app, cycle) tidepool_deployed_info)
- name: versions-alert
  rules:
  # WEEKLY: Saturday and Sunday from 07:00 UTC; the route sends ONE mail for them (repeat_interval 47h) and no "resolved" mail
  - alert: UpstreamReleaseNotDeployed
    expr: min_over_time(tidepool:behind_actionable[3d]) == 1 and on (app) (count_over_time(tidepool:behind_actionable[3d]) > 780) and on () ((day_of_week() == 6 or day_of_week() == 0) and hour() >= 7)
    labels: { severity: weekly }
    annotations: { summary: "{{ $labels.app }}: a newer stable release has been out for 3 days and can be had (bump flake.lock or the pin)" }
  # MONTHLY: the same weekend gate and the first weekend of the month (day of the month 7 or less)
  - alert: NixpkgsBehindUpstream
    expr: min_over_time(tidepool:behind_waiting[14d]) == 1 and on (app) (count_over_time(tidepool:behind_waiting[14d]) > 3600) and on () ((day_of_week() == 6 or day_of_week() == 0) and hour() >= 7 and day_of_month() <= 7)
    labels: { severity: monthly }
    annotations: { summary: "{{ $labels.app }}: nixpkgs has been behind a stable upstream release for 14 days (wait, or override)" }
  - alert: UpstreamMajorNotAdopted
    expr: min_over_time(tidepool:behind_major[3d]) == 1 and on (app) (count_over_time(tidepool:behind_major[3d]) > 780) and on () ((day_of_week() == 6 or day_of_week() == 0) and hour() >= 7 and day_of_month() <= 7)
    labels: { severity: monthly }
    annotations: { summary: "{{ $labels.app }}: a newer major exists upstream" }
  - alert: RunningLineEndOfLife
    expr: last_over_time(tidepool:line_eol[15m]) == 1 and on () ((day_of_week() == 6 or day_of_week() == 0) and hour() >= 7 and day_of_month() <= 7)
    labels: { severity: monthly }
    annotations: { summary: "{{ $labels.app }}: the running release line is end of life upstream" }
  # a deploy changed the kernel but the machine still runs the old one: the activated generation's kernel (the Nix-written file) against the running kernel (the node exporter's uname)
  - alert: RebootPending
    expr: tidepool_deployed_info{app="linux"} unless on (version) label_replace(node_uname_info, "version", "$1", "release", "(.*)")
    for: 1d
    labels: { severity: warning }
    annotations: { summary: "a new kernel ({{ $labels.version }}) is installed but the machine still runs the old one: reboot" }
  # the watch itself: if the sources cannot be read for a day, silence would look like "all current"
  - alert: VersionWatchBlind
    expr: up{job=~"upstream-.*"} == 0
    for: 1d
    labels: { severity: warning }
    annotations: { summary: "the version watch cannot read {{ $labels.instance }}" }
