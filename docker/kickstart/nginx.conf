# nginx.conf - temporary kickstart (HTTP only)
# Used ONLY to obtain the SSL certificates the first time.
# It has no HTTPS and no proxy — it only serves the ACME challenges.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else: empty 200 (not a redirect, certbot might follow it)
        location / {
            return 200 'kickstart';
            add_header Content-Type text/plain;
        }
    }
}
