# nginx.conf - Kickstart temporaneo (HTTP only)
# Usato SOLO per ottenere i certificati SSL la prima volta.
# Non ha HTTPS, non ha proxy — serve solo le ACME challenge.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        # ACME challenge per Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Tutto il resto: 200 vuoto (non redirect, certbot potrebbe seguirlo)
        location / {
            return 200 'kickstart';
            add_header Content-Type text/plain;
        }
    }
}
