# ============================================================================
# REDACTED_HOSTNAME_UC CLOUD PLATFORM - DOCKER COMPOSE CONFIGURATION
# ============================================================================
#
# Complete stack for a self-hosted cloud platform that includes:
# - Immich: photo and video management with AI
# - Jellyfin/Plex: media servers for streaming
# - Nginx: reverse proxy with SSL termination
# - Certbot: automatic management of SSL certificates
#
# For initial configuration see: .env.example
# For automatic deployment run: ./deploy.sh
#
# ============================================================================

services:

  # ==========================================================================
  # IMMICH PHOTO MANAGEMENT SERVICES
  # ==========================================================================

  # Immich Server - main service for photo/video management
  # Hardware-accelerated video transcoding via VA-API (REDACTED_GPU_MODEL)
  immich-server:
    container_name: immich_server
    ports:
      # Localhost: used by local tooling / deploy check. "Public" access
      # still goes through nginx over the docker network (not through this host port).
      - "127.0.0.1:${IMMICH_PORT:-2283}:2283"
      # Direct LAN: clients on the local network reach Immich without the
      # DNS->WAN->hairpin-NAT->nginx round trip (connectivity optimization on an
      # unstable WiFi). Bound to the LAN IP -> NOT exposed on the WAN (the router only forwards
      # 80/443); Immich has its own authentication anyway.
      - "${IMMICH_LAN_IP:-REDACTED_LAN_IP}:${IMMICH_PORT:-2283}:2283"
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"   # render — GPU access for REDACTED_GPU_MODEL (VA-API transcoding)
      - "44"    # video
    volumes:
      # Custom initialization script
      # - ./scripts/immich-init.sh:/usr/local/bin/immich-init.sh:ro
      # Main storage for photos, videos and metadata
      - ${IMMICH_DATA}:/data
      # Time zone synchronization with the host
      - /etc/localtime:/etc/localtime:ro
      # Synchronization with iCloud
      - ${ICLOUD_PHOTOS_DIR:-./data/icloud-photos}:/import
    environment:
      TZ: ${IMMICH_TZ:-Etc/UTC}
      # PostgreSQL database configuration
      DB_HOSTNAME: immich-database
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME}
      # Redis cache configuration
      REDIS_HOSTNAME: immich-redis
      IMMICH_API_KEY: ${IMMICH_API_KEY}
    extra_hosts:
      - 'cloud.REDACTED_DOMAIN:host-gateway'
    depends_on:
      - immich-database
      - immich-redis
    restart: always
    healthcheck:
      disable: false

  # Immich Machine Learning - AI service for object/face recognition
  # Uses OpenVINO for REDACTED_GPU_MODEL GPU acceleration
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"   # render — GPU access for REDACTED_GPU_MODEL (OpenVINO)
      - "44"    # video
    volumes:
      # Cache for AI models (automatic download on first start)
      - model-cache:/cache
    environment:
      TZ: ${IMMICH_TZ:-Etc/UTC}
      # Connection to the database shared with immich-server
      DB_HOSTNAME: immich-database
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME}
      REDIS_HOSTNAME: immich-redis
    restart: always
    healthcheck:
      disable: false

  # Redis Cache - in-memory cache for Immich (sessions, thumbnails, etc.)
  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:4a7d243f2890e13198440dcfc8d24c9adf9d4fc4092389c89c12a6fda43d3704
    environment:
      TZ: ${IMMICH_TZ:-Etc/UTC}
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  # PostgreSQL Database - main database for Immich metadata
  immich-database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      TZ: ${IMMICH_TZ:-Etc/UTC}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Optimization for HDD storage (uncomment if you use an SSD)
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Persistent storage for the PostgreSQL database
      - ${IMMICH_DB_DATA}:/var/lib/postgresql/data
    # Shared memory for PostgreSQL (performance optimization)
    shm_size: 128mb
    restart: always

  # ==========================================================================
  # JELLYFIN MEDIA SERVER
  # ==========================================================================

  # Jellyfin - media server for video, audio and photo streaming
  jellyfin:
    image: jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
    container_name: jellyfin
    user: ${JELLYFIN_UID:-1000}:${JELLYFIN_GID:-1000}
    group_add:
      - "992"   # render — GPU access for REDACTED_GPU_MODEL (VA-API)
      - "44"    # video
    environment:
      - TZ=${JELLYFIN_TZ:-Europe/Rome}
      # Public URL for autodiscovery (optional)
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLIC_URL:-https://jellyfin.REDACTED_HOSTNAME.REDACTED_DDNS}
    volumes:
      # Jellyfin configuration and metadata
      - ${JELLYFIN_CONFIG}:/config
      # Cache for transcoding and thumbnails
      - ${JELLYFIN_CACHE}:/cache
      # Media directory (movies, TV series, music, photos)
      - type: bind
        source: ${JELLYFIN_MEDIA}
        target: /media
        read_only: ${JELLYFIN_MEDIA_READONLY:-true}
      # Secondary media directory (optional)
      - type: bind
        source: ${JELLYFIN_MEDIA2:-/dev/null}
        target: /media2
        read_only: ${JELLYFIN_MEDIA_READONLY:-true}
      # Custom fonts for subtitle burn-in during transcoding (optional)
      - type: bind
        source: ${JELLYFIN_FONTS:-/usr/share/fonts}
        target: /usr/local/share/fonts/custom
        read_only: true
    ports:
      # Port for direct access (optional, mainly used for autodiscovery).
      # Bound to localhost: public access goes through nginx (jellyfin-backend over the
      # docker network). NB: this disables autodiscovery/direct access on :8096
      # from LAN clients (DLNA). To re-enable it, remove "127.0.0.1:".
      - "127.0.0.1:${JELLYFIN_PORT:-8096}:8096"
    restart: unless-stopped
    # Required for REDACTED_GPU_MODEL hardware transcoding (VA-API)
    devices:
      - /dev/dri:/dev/dri
    # Required for the Docker healthcheck in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'cloud.REDACTED_DOMAIN:host-gateway'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # PLEX MEDIA SERVER
  # ==========================================================================

  # Plex - alternative media server for video, audio and photo streaming
  plex:
    image: plexinc/pms-docker:1.43.0.10492-121068a07@sha256:b59f6e65a3ec5fad1f5ad417f9911340b71f34efe333338429eeb2dbac5e524e
    container_name: plex
    profiles:
      - plex
    network_mode: host
    environment:
      - TZ=${PLEX_TZ:-Europe/Rome}
      - PLEX_CLAIM=${PLEX_CLAIM_TOKEN:-}
      - PLEX_UID=${PLEX_UID:-1000}
      - PLEX_GID=${PLEX_GID:-1000}
      - PLEX_MEDIA_SERVER_DISABLE_USB=1
      # Public URL for external access
      - ADVERTISE_IP=${PLEX_ADVERTISE_IP:-https://plex.REDACTED_HOSTNAME.REDACTED_DDNS:443}
    volumes:
      # Plex configuration and metadata
      - ${PLEX_CONFIG}:/config
      # Media directories shared with Jellyfin
      - type: bind
        source: ${JELLYFIN_MEDIA}
        target: /media
        read_only: ${JELLYFIN_MEDIA_READONLY:-true}
      # Secondary media directory (optional)
      - type: bind
        source: ${JELLYFIN_MEDIA2:-/dev/null}
        target: /media2
        read_only: true
    restart: unless-stopped
    # Required for hardware transcoding (if available)
    devices:
      - /dev/dri:/dev/dri
      - /dev/bus/usb:/dev/bus/usb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/web"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # JELLYPLEX-WATCHED - SYNC MEDIA WATCH STATUS
  # ==========================================================================

  # JellyPlex-Watched - syncs watch status between Jellyfin and Plex
  jellyplex-watched:
    image: luigi311/jellyplex-watched:sha-cebff13@sha256:5989cff75e8cc4da00b2dc4bd7afa917ec88f1097bd5b5145ff311ecb5d4c37f
    container_name: jellyplex-watched
    profiles:
      - plex
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PUID=${JELLYPLEX_PUID:-1000}
      - PGID=${JELLYPLEX_PGID:-1000}
      - TZ=${JELLYPLEX_TZ:-Europe/Rome}
    env_file: 
      - .env
    depends_on:
      jellyfin:
        condition: service_healthy
      plex:
        condition: service_healthy
    # Sync every hour
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python.*main.py"]
      interval: 300s
      timeout: 30s
      retries: 3
      start_period: 60s

  # ==========================================================================
  # VAULTWARDEN (BITWARDEN) - PASSWORD MANAGER
  # ==========================================================================

  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=${BITWARDEN_DOMAIN:-https://bitwarden.REDACTED_HOSTNAME.REDACTED_DDNS}
      - ADMIN_TOKEN=${BITWARDEN_ADMIN_TOKEN}
      - WEBSOCKET_ENABLED=${BITWARDEN_WEBSOCKET_ENABLED:-true}
      - SIGNUPS_ALLOWED=${BITWARDEN_SIGNUPS_ALLOWED:-false}
      - SIGNUPS_VERIFY=${BITWARDEN_SIGNUPS_VERIFY:-false}
      - INVITATIONS_ALLOWED=${BITWARDEN_INVITATIONS_ALLOWED:-true}
      - SMTP_HOST=${BITWARDEN_SMTP_HOST:-${SMTP_HOST}}
      - SMTP_PORT=${BITWARDEN_SMTP_PORT:-${SMTP_PORT}}
      - SMTP_SSL=${BITWARDEN_SMTP_SSL:-${SMTP_SSL}}
      - SMTP_EXPLICIT_TLS=${BITWARDEN_SMTP_EXPLICIT_TLS:-${SMTP_EXPLICIT_TLS}}
      - SMTP_FROM=${BITWARDEN_SMTP_FROM:-${SMTP_FROM}}
      - SMTP_FROM_NAME=${BITWARDEN_SMTP_FROM_NAME:-${SMTP_FROM_NAME}}
      - SMTP_USERNAME=${BITWARDEN_SMTP_USERNAME:-${SMTP_USERNAME}}
      - SMTP_PASSWORD=${BITWARDEN_SMTP_PASSWORD:-${SMTP_PASSWORD}}
      - TZ=${BITWARDEN_TZ:-Europe/Rome}
      - LOG_FILE=/data/vaultwarden.log
      # SSO (OIDC via Nextcloud)
      - SSO_ENABLED=${BITWARDEN_SSO_ENABLED:-false}
      - SSO_CLIENT_ID=${BITWARDEN_SSO_CLIENT_ID:-}
      - SSO_CLIENT_SECRET=${BITWARDEN_SSO_CLIENT_SECRET:-}
      - SSO_AUTHORITY=${BITWARDEN_SSO_AUTHORITY:-}
      - SSO_PKCE=${BITWARDEN_SSO_PKCE:-true}
    extra_hosts:
      - "cloud.REDACTED_DOMAIN:host-gateway"
    volumes:
      - ./data/vaultwarden:/data
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # WEBDAV BACKUP (GRAPHENEOS)
  # ==========================================================================

  webdav:
    image: bytemark/webdav:2.4@sha256:bcabbc024c511b9c63ed3345f88573e31d84c952ee493c9acb3fe345f4f80f57
    container_name: webdav
    restart: unless-stopped
    environment:
      - AUTH_TYPE=${WEBDAV_AUTH_TYPE:-Basic}
      - USERNAME=${WEBDAV_USERNAME}
      - PASSWORD=${WEBDAV_PASSWORD}
      - SERVER_NAMES=${WEBDAV_SERVER_NAMES:-webdav.REDACTED_HOSTNAME.REDACTED_DDNS}
    volumes:
      - ${WEBDAV_DATA}:/var/lib/dav
      - ./data/webdav-extra.conf:/usr/local/apache2/conf/sites-enabled/seedvault.conf:ro
    expose:
      - "80"

  # ==========================================================================
  # SYNCTHING - FILE SYNCHRONIZATION
  # ==========================================================================

  syncthing:
    image: syncthing/syncthing:v2.0.14@sha256:6d2ab058383b533e045cf2c32fc4c6bbe87c612c92bc2aca9f552fb099b2e123
    container_name: syncthing
    restart: unless-stopped
    hostname: REDACTED_HOSTNAME-syncthing
    environment:
      - PUID=${SYNCTHING_PUID:-1000}
      - PGID=${SYNCTHING_PGID:-1000}
    volumes:
      - ${SYNCTHING_DATA:-./data/syncthing}:/var/syncthing
    expose:
      - "8384"
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
  # ==========================================================================
  # ICLOUD PHOTO SYNC SERVICES
  # ==========================================================================

  # iCloudPD - photo sync from iCloud to Immich
  icloudpd:
    image: icloudpd/icloudpd:1.32.2@sha256:fb659bf9f8c2069d1a0585010046a0ef709f7f5915daa522b8bdcda17f28ada2
    container_name: icloud-sync
    restart: unless-stopped
    profiles:
      - icloud
    entrypoint: ["sh", "/app/scripts/icloudpd-wrapper.sh"]
    environment:
      - TZ=${ICLOUD_TZ:-Europe/Rome}
      - PUID=${ICLOUD_UID:-1000}
      - PGID=${ICLOUD_GID:-1000}
      - ICLOUD_USERNAME=${ICLOUD_USERNAME}
      - ICLOUD_SYNC_INTERVAL=${ICLOUD_SYNC_INTERVAL:-3600}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      # Directory where photos are downloaded (configuration updated after authentication)
      - ${ICLOUD_PHOTOS_DIR:-./data/icloud-photos}:/app/photos
      # Script for automatic crash handling and XMP fixes
      - ./scripts/icloudpd-wrapper.sh:/app/scripts/icloudpd-wrapper.sh:ro
      - ./scripts/update-xmp-datetime.sh:/app/scripts/update-xmp-datetime.sh:ro
      - ./scripts/fix-missing-xmp.sh:/app/scripts/fix-missing-xmp.sh:ro
    depends_on:
      - immich-server

  # ==========================================================================
  # REVERSE PROXY AND SSL SERVICES
  # ==========================================================================

  # Nginx Reverse Proxy - handles routing, SSL termination and security
  nginx:
    container_name: nginx
    restart: always
    image: nginx@sha256:f6daac2445b0ce70e64d77442ccf62839f3f1b4c24bf6746a857eff014e798c8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Ports exposed for external access
      - "80:80"   # HTTP (redirect to HTTPS)
      - "443:443"  # HTTPS (main traffic)
    volumes:
      # Main nginx configuration
      - ./data/nginx:/etc/nginx/
      # Let's Encrypt SSL certificates
      - ./data/certbot/conf:/etc/letsencrypt
      # Directory for ACME challenges
      - certbot-www:/var/www/certbot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      # Wait until all backend services are ready
      - immich-server
      - immich-machine-learning
      - immich-redis
      - immich-database
      - jellyfin
      - vaultwarden
      - webdav
      - syncthing
      - nextcloud

  # Certbot - automatic management of Let's Encrypt SSL certificates
  certbot:
    container_name: private-certbot
    image: certbot/certbot@sha256:878bf5fe090724a2a839cf765b847252386a3782d1e36f6299c4e59ec7d2067e
    volumes:
      # Persistent storage for certificates
      - ./data/certbot/conf:/etc/letsencrypt
      # Directory for ACME challenges
      - certbot-www:/var/www/certbot
    # Command to obtain certificates for all domains
    # add them with -d if you enable that vhost in nginx.conf.
    command: certonly --cert-name REDACTED_HOSTNAME.REDACTED_DDNS --webroot -w /var/www/certbot --email "$EMAIL" -d "REDACTED_HOSTNAME.REDACTED_DDNS" -d "www.REDACTED_DOMAIN" -d "immich.REDACTED_HOSTNAME.REDACTED_DDNS" -d "immich.REDACTED_DOMAIN" -d "jellyfin.REDACTED_HOSTNAME.REDACTED_DDNS" -d "jellyfin.REDACTED_DOMAIN" -d "plex.REDACTED_HOSTNAME.REDACTED_DDNS" -d "plex.REDACTED_DOMAIN" -d "bitwarden.REDACTED_HOSTNAME.REDACTED_DDNS" -d "bitwarden.REDACTED_DOMAIN" -d "webdav.REDACTED_HOSTNAME.REDACTED_DDNS" -d "webdav.REDACTED_DOMAIN" -d "syncthing.REDACTED_HOSTNAME.REDACTED_DDNS" -d "syncthing.REDACTED_DOMAIN" -d "modem.REDACTED_HOSTNAME.REDACTED_DDNS" -d "modem.REDACTED_DOMAIN" -d "REDACTED_NAME.REDACTED_DOMAIN" -d "cloud.REDACTED_HOSTNAME.REDACTED_DDNS" -d "cloud.REDACTED_DOMAIN" -d "incus.REDACTED_DOMAIN" --rsa-key-size 4096 --agree-tos --no-eff-email --force-renewal
    depends_on:
      - nginx

  # ==========================================================================
  # SMART DISK HEALTH CHECKER
  # ==========================================================================
  smartcheck:
    image: alpine:3.23.3@sha256:59855d3dceb3ae53991193bd03301e082b2a7faa56a514b03527ae0ec2ce3a95
    container_name: smartcheck
    restart: unless-stopped
    cap_add:
      - SYS_RAWIO
    devices:
      - /dev/smartcheck-nas2:/dev/smartcheck-nas2
      - /dev/smartcheck-nas:/dev/smartcheck-nas
    environment:
      - SMART_DEVICES=${SMART_DEVICES:-/dev/smartcheck-nas2 /dev/smartcheck-nas}
      - SMART_CHECK_INTERVAL=${SMART_CHECK_INTERVAL:-12h}
      - SMART_ALERT_EMAIL=${SMART_ALERT_EMAIL}
      - SMART_TEMP_WARN=${SMART_TEMP_WARN:-45}
      - SMART_TEMP_CRIT=${SMART_TEMP_CRIT:-50}
      - SMART_REALLOCATED_WARN=${SMART_REALLOCATED_WARN:-1}
      - SMART_PENDING_WARN=${SMART_PENDING_WARN:-1}
      - SMART_CRC_WARN=${SMART_CRC_WARN:-1}
      - SMART_CMD_TIMEOUT_WARN=${SMART_CMD_TIMEOUT_WARN:-1}
      - SMART_SPIN_RETRY_WARN=${SMART_SPIN_RETRY_WARN:-1}
      - SMTP_HOST=${SMART_SMTP_HOST:-${SMTP_HOST}}
      - SMTP_PORT=${SMART_SMTP_PORT:-${SMTP_PORT}}
      - SMTP_USERNAME=${SMART_SMTP_USERNAME:-${SMTP_USERNAME}}
      - SMTP_PASSWORD=${SMART_SMTP_PASSWORD:-${SMTP_PASSWORD}}
      - SMTP_FROM=${SMART_SMTP_FROM:-${SMTP_FROM}}
      - SMTP_FROM_NAME=${SMART_SMTP_FROM_NAME:-${SMTP_FROM_NAME}}
      - SMTP_SSL=${SMART_SMTP_SSL:-${SMTP_SSL}}
      - SMTP_EXPLICIT_TLS=${SMART_SMTP_EXPLICIT_TLS:-${SMTP_EXPLICIT_TLS}}
    volumes:
      - ./scripts/smartcheck.sh:/usr/local/bin/smartcheck.sh:ro
      - ./data/smartcheck/logs:/var/log/smart
    command: ["/bin/sh", "/usr/local/bin/smartcheck.sh"]

  # ==========================================================================
  # BORGBACKUP SSH ENDPOINT (REDACTED_DRIVE2_TC)
  # ==========================================================================

# =============================================================================
# DOCKER VOLUMES - persistent storage for the services
# =============================================================================

  # ==========================================================================
  # NEXTCLOUD - PERSONAL CLOUD
  # ==========================================================================

  nextcloud:
    image: nextcloud:33-apache
    container_name: nextcloud
    restart: unless-stopped
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=${NEXTCLOUD_DB_NAME:-nextcloud}
      - MYSQL_USER=${NEXTCLOUD_DB_USER:-nextcloud}
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS:-cloud.REDACTED_DOMAIN cloud.REDACTED_HOSTNAME.REDACTED_DDNS}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=${NEXTCLOUD_OVERWRITECLIURL:-https://cloud.REDACTED_DOMAIN}
      - SMTP_HOST=${NEXTCLOUD_SMTP_HOST:-${SMTP_HOST}}
      - SMTP_PORT=${NEXTCLOUD_SMTP_PORT:-${SMTP_PORT}}
      - SMTP_SECURE=${NEXTCLOUD_SMTP_SECURE:-tls}
      - SMTP_AUTHTYPE=${NEXTCLOUD_SMTP_AUTHTYPE:-LOGIN}
      - SMTP_NAME=${NEXTCLOUD_SMTP_NAME:-${SMTP_USERNAME}}
      - SMTP_PASSWORD=${NEXTCLOUD_SMTP_PASSWORD:-${SMTP_PASSWORD}}
      - MAIL_FROM_ADDRESS=${NEXTCLOUD_MAIL_FROM_ADDRESS:-}
      - MAIL_DOMAIN=${NEXTCLOUD_MAIL_DOMAIN:-}
      - TZ=Europe/Rome
    volumes:
      - ./data/nextcloud/html:/var/www/html
      - ./data/nextcloud/data:/var/www/html/data
      - ./scripts/nextcloud-smtp-hook.sh:/docker-entrypoint-hooks.d/before-starting/50-nextcloud-smtp.sh:ro
    expose:
      - "80"
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nextcloud-db:
    image: mariadb:11
    container_name: nextcloud_mariadb
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD:-${NEXTCLOUD_DB_PASSWORD}}
      - MYSQL_DATABASE=${NEXTCLOUD_DB_NAME:-nextcloud}
      - MYSQL_USER=${NEXTCLOUD_DB_USER:-nextcloud}
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - TZ=Europe/Rome
    volumes:
      - ./data/nextcloud/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud-redis:
    image: docker.io/valkey/valkey:8-bookworm
    container_name: nextcloud_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  # Shared cache for Immich AI models
  model-cache:
  # Shared ACME webroot for certbot and nginx
  certbot-www:
