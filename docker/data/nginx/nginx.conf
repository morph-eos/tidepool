        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Block access to hidden files and env secrets (allow SeedVault backup path)
        location ~ /\.(?!well-known|SeedVaultAndroidBackup)(.*)$ {
            return 404;
        }

        # Allow larger uploads for backups
        client_max_body_size 20G;

        # Proxy to WebDAV server
        location / {
          proxy_pass http://webdav-backend;
      
          proxy_http_version 1.1;
          proxy_set_header Connection "";
      
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      
          proxy_request_buffering off;
          proxy_buffering off;
      
          client_body_buffer_size 512k;
      }
    }

    # ========================================================================
    # SYNCTHING - syncthing.REDACTED_HOSTNAME.REDACTED_DDNS
    # ========================================================================
    server {
        listen 8442 ssl http2 proxy_protocol;
        listen [::]:443 ssl http2;

        server_name syncthing.REDACTED_HOSTNAME.REDACTED_DDNS syncthing.REDACTED_DOMAIN;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/privkey.pem;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Block access to hidden files and env secrets
        location ~ /\.(?!well-known)(.*)$ {
            return 404;
        }

        # Proxy to Syncthing GUI
        location / {
            proxy_pass http://syncthing-backend;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ACME challenge location
        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ========================================================================
    # NEXTCLOUD - cloud.REDACTED_HOSTNAME.REDACTED_DDNS / cloud.REDACTED_DOMAIN
    # ========================================================================
    server {
        listen 8442 ssl http2 proxy_protocol;
        listen [::]:443 ssl http2;

        server_name cloud.REDACTED_HOSTNAME.REDACTED_DDNS cloud.REDACTED_DOMAIN;

        ssl_certificate /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Nextcloud needs large uploads
        client_max_body_size 10G;
        client_body_timeout 300s;

        # Block access to hidden files
        location ~ /\.(?!well-known)(.*)$ {
            return 404;
        }

        # CalDAV/CardDAV well-known redirects
        location /.well-known/carddav {
            return 301 $scheme://$host/remote.php/dav;
        }
        location /.well-known/caldav {
            return 301 $scheme://$host/remote.php/dav;
        }
        location /.well-known/webfinger {
            return 301 $scheme://$host/index.php/.well-known/webfinger;
        }
        location /.well-known/nodeinfo {
            return 301 $scheme://$host/index.php/.well-known/nodeinfo;
        }

        location / {
            proxy_pass http://nextcloud-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ==========================================================================
    # MODEM/ROUTER ADMIN - htaccess protected
    # ==========================================================================
    server {
        listen 8442 ssl http2 proxy_protocol;
        listen [::]:443 ssl http2;

        server_name modem.REDACTED_HOSTNAME.REDACTED_DDNS modem.REDACTED_DOMAIN;

        ssl_certificate /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Basic auth - required for all requests
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/htpasswd/modem;

        location / {
            proxy_pass http://192.0.2.1;
            proxy_http_version 1.1;
            proxy_set_header Host 192.0.2.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }

    # REDACTED_NAME.REDACTED_DOMAIN - sito per REDACTED_NAME
    server {
        listen 8442 ssl proxy_protocol;
        server_name REDACTED_NAME.REDACTED_DOMAIN;

        ssl_certificate /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        root /etc/nginx/REDACTED_NAME;
        index index.html;

        auth_basic "Accesso riservato";
        auth_basic_user_file /etc/nginx/htpasswd/REDACTED_NAME;

        location /festa-ruolo {
            auth_basic off;
            try_files $uri $uri/ /festa-ruolo/index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

}

# =============================================================================
# STREAM: SNI-based routing su porta 443
# - incus.REDACTED_DOMAIN → TCP passthrough verso Incus (mTLS intatto)
# - tutti gli altri → blocco HTTP interno su 8442
# =============================================================================
stream {
    map $ssl_preread_server_name $upstream_443 {
        incus.REDACTED_DOMAIN  127.0.0.1:18443;
        default            127.0.0.1:8442;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $upstream_443;
        proxy_protocol on;
    }

    # Incus non supporta PROXY protocol: hop interno che lo rimuove prima
    # di inoltrare il TLS/mTLS originale intatto verso Incus.
    server {
        listen 127.0.0.1:18443 proxy_protocol;
        proxy_pass 172.17.0.1:8443;
    }
}
