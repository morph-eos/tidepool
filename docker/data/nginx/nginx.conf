        ssl_prefer_server_ciphers on;
        ssl_session_timeout 10m;

        # Security headers - Plex specific considerations
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        # NO X-Frame-Options header for Plex - it handles framing internally

        # Block access to hidden files and env secrets
        location ~ /\.(?!well-known)(.*)$ {
            return 404;
        }

        # Cache control - Disable caching for Plex
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Special location for video streaming
        location ~* ^/(video|photo|library/parts)/.+\.(mp4|mkv|avi|mov|wmv|flv|webm|m4v|jpg|jpeg|png)$ {
            proxy_pass http://plex-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Range support for video seeking
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            
            # No buffering for streaming
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            
            # Extended timeouts for large files
            proxy_connect_timeout 60s;
            proxy_send_timeout 86400s;  # 24 hours for long movies
            proxy_read_timeout 86400s;   # 24 hours for long movies
            
            # Compatibility
            add_header Accept-Ranges bytes always;
            proxy_set_header Accept-Encoding "";
            
            # Keep connection alive for streaming
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # WebSocket support for Plex
        location /:/websockets/notifications {
            proxy_pass http://plex-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy to Plex server
        location / {
            proxy_pass http://plex-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Plex specific headers
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Plex-Client-Identifier $http_x_plex_client_identifier;
            proxy_set_header X-Plex-Device $http_x_plex_device;
