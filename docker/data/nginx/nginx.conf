# ============================================================================
# NGINX REVERSE PROXY CONFIGURATION
# REDACTED_HOSTNAME_TC Cloud Infrastructure - Multi-Service Setup
# ============================================================================
# 
# This configuration implements a secure reverse proxy for multiple services:
# - Main site: REDACTED_HOSTNAME.REDACTED_DDNS
# - Immich photo management: immich.REDACTED_HOSTNAME.REDACTED_DDNS
# 
# Features:
# - Automatic HTTP to HTTPS redirection
# - SSL/TLS termination with Let's Encrypt certificates
# - Proxy pass to respective containers
# - ACME challenge handling for certificate renewal
# - Security optimizations and performance tuning
# 
# Author: REDACTED_OWNER_NAME (REDACTED_GITHUB_URL)
# Version: 2.0.0
# ============================================================================

# Global events configuration
events {
    worker_connections 1024;
}

# Main HTTP configuration block
http {
    # ========================================================================
    # UPSTREAM DEFINITIONS
    # ========================================================================
    
    # DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s;
    
    # Immich server upstream
    upstream immich-backend {
        server immich-server:2283;
    }
    
    # Jellyfin media server upstream
    upstream jellyfin-backend {
        server jellyfin:8096;
    }
    
    # Plex media server upstream
    upstream plex-backend {
        server host.docker.internal:32400;
    }

    # Vaultwarden (Bitwarden) upstream
    upstream vaultwarden-backend {
        server vaultwarden:80;
    }

    # WebDAV backup upstream
    upstream webdav-backend {
        server webdav:80;
    }
    # Syncthing upstream
    upstream syncthing-backend {
        server syncthing:8384;
    }

    # Nextcloud upstream
    upstream nextcloud-backend {
        server nextcloud:80;
    }
    
    # ========================================================================
    # SECURITY AND PERFORMANCE SETTINGS
    # ========================================================================
    
    # Hide nginx version information for security
    server_tokens off;
    
    # Set maximum client body size for large file uploads (1GB support)
    client_max_body_size 1G;
    
    # Timeouts for uploads and long requests - estesi per file da 1GB
    client_body_timeout 1800s;  # 30 minuti
    client_header_timeout 1800s;
    proxy_connect_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    
    # Compression settings
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Disable gzip for media files to avoid issues with Jellyfin
    gzip_disable "MSIE [1-6]\.";
    
    # Cache control - Disable global caching for media streaming
    proxy_cache off;
    proxy_store off;
    
    # Real IP configuration
    real_ip_header proxy_protocol;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;

    # ========================================================================
    # HTTP ACME CHALLENGE + REDIRECT
    # ========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================================
    # MAIN SITE - REDACTED_HOSTNAME.REDACTED_DDNS
    # ========================================================================
    server {
        listen 8442 ssl http2 proxy_protocol;
        listen [::]:443 ssl http2;
        
        server_name REDACTED_HOSTNAME.REDACTED_DDNS www.REDACTED_DOMAIN;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/privkey.pem;
        
        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Block access to hidden files and env secrets
        location ~ /\.(?!well-known)(.*)$ {
            return 404;
        }

        # Proxy/Redirect to local gateway 192.0.2.1
        location / {
            # proxy_pass http://192.0.2.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ACME challenge location
        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ========================================================================
    # IMMICH PHOTO MANAGEMENT - immich.REDACTED_HOSTNAME.REDACTED_DDNS
    # ========================================================================
    server {
        listen 8442 ssl http2 proxy_protocol;
        listen [::]:443 ssl http2;
        
        server_name immich.REDACTED_HOSTNAME.REDACTED_DDNS immich.REDACTED_DOMAIN;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/privkey.pem;
        
        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Block access to hidden files and env secrets
        location ~ /\.(?!well-known)(.*)$ {
            return 404;
        }

        # Cache control - Disable caching for Immich (has internal cache)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Proxy to Immich server
        location / {
            proxy_pass http://immich-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Disable caching at proxy level
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # ACME challenge location
        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ========================================================================
    # JELLYFIN MEDIA SERVER - jellyfin.REDACTED_HOSTNAME.REDACTED_DDNS
    # ========================================================================
    server {
        listen 8442 ssl http2 proxy_protocol;
        listen [::]:443 ssl http2;
        
        server_name jellyfin.REDACTED_HOSTNAME.REDACTED_DDNS jellyfin.REDACTED_DOMAIN;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/REDACTED_HOSTNAME.REDACTED_DDNS/privkey.pem;
        
        # SSL security settings - Extended compatibility for older devices
        # Supports older devices like smart TVs, legacy media players
        ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA:AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA256:AES128-SHA256:AES256-SHA:AES128-SHA:DES-CBC3-SHA;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 10m;

        # Security headers - Jellyfin specific considerations
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";
        # NO X-Frame-Options header for Jellyfin - it handles framing internally

        # Block access to hidden files and env secrets
        location ~ /\.(?!well-known)(.*)$ {
            return 404;
        }

        # Cache control - Disable caching for Jellyfin
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Special location for transcoding streams
        location ~* ^/(videos|Audio|Items)/.*/stream {
            proxy_pass http://jellyfin-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Range support for transcoded content
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            
            # No buffering for live transcoding
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            
            # Extended timeouts for transcoding
            proxy_connect_timeout 30s;
            proxy_send_timeout 86400s;  # 24 hours for long movies
            proxy_read_timeout 86400s;   # 24 hours for long movies
            
            # Compatibility
            add_header Accept-Ranges bytes always;
            proxy_set_header Accept-Encoding "";
            
            # Keep connection alive for streaming
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Special location for video files
        location ~* ^/Videos/.+\.(mp4|mkv|avi|mov|wmv|flv|webm|m4v)$ {
            proxy_pass http://jellyfin-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Essential for range requests and seeking
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            
            # Completely disable buffering for direct streaming
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            
            # Optimizations
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Extended timeouts for large video files
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Support partial content for video seeking
            add_header Accept-Ranges bytes always;
            proxy_set_header Accept-Encoding "";
        }

        # Proxy to Jellyfin server
        location / {
            proxy_pass http://jellyfin-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Emby-Authorization $http_x_emby_authorization;
            
            # Jellyfin specific headers
            proxy_set_header X-Forwarded-Host $server_name;
            
            # Disable buffering for media streaming
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            
            # WebSocket support for live features
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Compatibility headers for older devices
            proxy_set_header X-Forwarded-Ssl on;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Range request support for video seeking (ESSENTIAL for smart TVs)
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_no_cache $http_range $http_if_range;
            
            # Timeouts optimized for slow devices
            proxy_connect_timeout 450s;
            proxy_send_timeout 750s;
            proxy_read_timeout 750s;
            
            # Allow larger client body sizes for uploads
            client_max_body_size 50G;
            
            # Disable caching at proxy level
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            
            # Additional headers for better compatibility
            proxy_set_header Accept-Encoding "";
            add_header Accept-Ranges bytes always;
        

            # SSO button injection (setup_jellyfin_sso_button.sh)
            sub_filter_once on;
            sub_filter '</body>' '<script src="/nc-sso-button.js"></script></body>';
}

        # Static SSO button script (setup_jellyfin_sso_button.sh)
        location = /nc-sso-button.js {
            root /etc/nginx;
            add_header Cache-Control "no-cache" always;
        }

        # ACME challenge location
        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ========================================================================
    # PLEX MEDIA SERVER - plex.REDACTED_HOSTNAME.REDACTED_DDNS
